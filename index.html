    function App() {
      const [selectedClass, setSelectedClass] = useState("9A");
      const [selectedStudent, setSelectedStudent] = useState("");
      const [status, setStatus] = useState("Hadir");
      const [alasan, setAlasan] = useState("");
      const [pesan, setPesan] = useState("");

      const filteredStudents = MASTER_STUDENTS.filter(s => s.classGrade === selectedClass);

      const handleSubmit = (e) => {
        e.preventDefault();
        if(!selectedStudent) {
          alert("Silakan pilih nama siswa terlebih dahulu!");
          return;
        }
        const studentObj = MASTER_STUDENTS.find(s => s.id === selectedStudent);
        setPesan(`Presensi BERHASIL disimpan! Nama: ${studentObj.name} (${studentObj.classGrade}) - Status: ${status}`);
        setAlasan("");
      };

      return (
        <div className="p-4 max-w-md mx-auto my-6">
          <div className="bg-white p-6 rounded-2xl shadow-lg border border-slate-200">
            <h1 className="text-2xl font-bold text-center text-indigo-600 mb-1">PRESENSI SISWA KELAS 9</h1>
            <p className="text-xs text-center text-slate-500 mb-6">Sistem Informasi Kehadiran Online</p>

            {pesan && (
              <div className="mb-4 p-3 bg-emerald-100 border border-emerald-300 text-emerald-800 rounded-xl text-xs font-semibold text-center">
                {pesan}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Pilih Kelas</label>
                <select 
                  value={selectedClass} 
                  onChange={(e) => { setSelectedClass(e.target.value); setSelectedStudent(""); }}
                  className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-indigo-500 outline-none"
                >
                  <option value="9A">Kelas 9A</option>
                  <option value="9B">Kelas 9B</option>
                  <option value="9C">Kelas 9C</option>
                  <option value="9D">Kelas 9D</option>
                  <option value="9E">Kelas 9E</option>
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Pilih Nama Siswa</label>
                <select 
                  value={selectedStudent} 
                  onChange={(e) => setSelectedStudent(e.target.value)}
                  className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium focus:ring-2 focus:ring-indigo-500 outline-none"
                >
                  <option value="">-- Pilih Nama Siswa ({filteredStudents.length} Siswa) --</option>
                  {filteredStudents.map(s => (
                    <option key={s.id} value={s.id}>{s.nis} - {s.name}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Status Kehadiran</label>
                <div className="grid grid-cols-3 gap-2">
                  {["Hadir", "Izin", "Sakit"].map((st) => (
                    <button
                      key={st}
                      type="button"
                      onClick={() => setStatus(st)}
                      className={`p-3 rounded-xl text-xs font-bold transition-all border ${
                        status === st 
                          ? "bg-indigo-600 text-white border-indigo-600 shadow-md" 
                          : "bg-slate-50 text-slate-600 border-slate-200"
                      }`}
                    >
                      {st}
                    </button>
                  ))}
                </div>
              </div>

              {status !== "Hadir" && (
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Keterangan / Alasan</label>
                  <textarea
                    rows="2"
                    placeholder="Masukkan alasan perizinan..."
                    value={alasan}
                    onChange={(e) => setAlasan(e.target.value)}
                    className="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                  ></textarea>
                </div>
              )}

              <button 
                type="submit" 
                className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-3.5 rounded-xl shadow-lg transition-all text-sm mt-2"
              >
                Kirim Presensi
              </button>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
