      const [pesan, setPesan] = useState("");

      const [adminFilterClass, setAdminFilterClass] = useState("Semua");

      useEffect(() => {
        const savedData = localStorage.getItem("attendance_data");
        if (savedData) {
          setAttendances(JSON.parse(savedData));
        }
      }, []);

      const filteredStudents = MASTER_STUDENTS.filter(s => s.classGrade === selectedClass);

      const handleSubmitPresensi = (e) => {
        e.preventDefault();
        if(!selectedStudent) {
          alert("Silakan pilih nama siswa terlebih dahulu!");
          return;
        }
        const studentObj = MASTER_STUDENTS.find(s => s.id === selectedStudent);
        const newRecord = {
          id: Date.now(),
          nis: studentObj.nis,
          name: studentObj.name,
          classGrade: studentObj.classGrade,
          status: status,
          alasan: status !== "Hadir" ? alasan : "-",
          waktu: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
        };

        const updatedData = [newRecord, ...attendances];
        setAttendances(updatedData);
        localStorage.setItem("attendance_data", JSON.stringify(updatedData));

        setPesan(`Presensi BERHASIL disimpan untuk ${studentObj.name}!`);
        setSelectedStudent("");
        setAlasan("");
        setTimeout(() => setPesan(""), 4000);
      };

        e.preventDefault();
        if (password === "admin123#$") {
          setIsAdmin(true);
          setView("admin");
          setPassword("");
        } else {
          alert("Password Admin Salah!");
        }
      };

      const handleClearData = () => {
        if (confirm("Apakah Anda yakin ingin menghapus semua rekap data presensi?")) {
          setAttendances([]);
          localStorage.removeItem("attendance_data");
        }
      };

      const filteredAttendances = adminFilterClass === "Semua" 
        ? attendances 
        : attendances.filter(a => a.classGrade === adminFilterClass);

                  </button>

                    className="px-3 py-1.5 bg-rose-50 text-rose-600 border border-rose-200 rounded-lg text-xs font-bold"

                    Keluar
                  </button>

                </button>

              )}

                    value={selectedClass}

                    <option value="9B">Kelas 9B</option>
                    <option value="9C">Kelas 9C</option>
                    <option value="9D">Kelas 9D</option>
                    <option value="9E">Kelas 9E</option>
                  </select>
                </div>

                    <option value="">-- Pilih Nama ({filteredStudents.length} Siswa) --</option>

                      <option key={s.id} value={s.id}>{s.nis} - {s.name}</option>

                  </select>
                </div>

                      </button>
